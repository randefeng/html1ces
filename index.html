<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的 GitHub Pages 测试页</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      text-align: center;
      padding: 20px;
    }
    .card {
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 20px;
      padding: 48px 40px;
      max-width: 520px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
    }
    h1 { font-size: 2rem; margin-bottom: 12px; }
    p { opacity: 0.9; line-height: 1.7; margin-bottom: 20px; }
    .time {
      font-size: 2.4rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: 2px;
      margin: 24px 0;
    }
    button {
      padding: 12px 28px;
      border: none;
      border-radius: 999px;
      background: #fff;
      color: #5b3fa8;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    button:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
    button:active { transform: translateY(0); }
    .footer { margin-top: 28px; font-size: 0.85rem; opacity: 0.7; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🎉 GitHub Pages 部署成功！</h1>
    <p>如果你能看到这个页面，说明你的静态站点已经通过域名正常访问了。</p>
    <div class="time" id="clock">--:--:--</div>
    <button onclick="greet()">点我试试</button>
    <p class="footer">这个页面完全由 HTML + CSS + JS 构成</p>
  </div>

  <script>
    // 实时时钟
    function tick() {
      const now = new Date();
      document.getElementById('clock').textContent = now.toLocaleTimeString('zh-CN', { hour12: false });
    }
    tick();
    setInterval(tick, 1000);

    // 按钮交互
    function greet() {
      const names = ['太棒了！', '部署成功 🚀', '这就是 GitHub Pages 😎', '继续加油！'];
      alert(names[Math.floor(Math.random() * names.length)]);
    }
  </script>
</body>
</html>
